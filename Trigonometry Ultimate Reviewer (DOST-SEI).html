<script>
const $=s=>document.querySelector(s),R=["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII"];
const T=[
["Angle Measurement",["An angle in standard position starts on the positive x-axis. Counterclockwise is positive, clockwise is negative.","One full turn is 360° = 2π rad, so half a turn is 180° = π rad."],["deg → rad: × π/180","rad → deg: × 180/π","1 rev = 360° = 2π rad"],[["Convert 135° to radians.","Multiply by π/180: 135π/180. Divide top and bottom by 45 to get 3π/4."],["Convert 5π/6 rad to degrees.","Multiply by 180/π. The π cancels, leaving 5·180/6 = 150°."],["Degrees and radians in 2.5 revolutions?","2.5 × 360° = 900°, and 2.5 × 2π = 5π rad."]]],
["Coterminal and Reference Angles",["Coterminal angles end on the same side, so they differ by full turns.","The reference angle is the acute angle between the terminal side and the x-axis. It lets you reuse special-angle values."],["Coterminal: θ ± 360°k (or θ ± 2πk)","QI: θ · QII: 180° − θ · QIII: θ − 180° · QIV: 360° − θ"],[["Reference angle of 1000°?","Remove full turns: 1000 − 720 = 280°, which is in QIV. Then 360° − 280° = 80°."],["Smallest positive angle coterminal with −750°?","Add 360° until positive: −750 + 1080 = 330°."]]],
["Arc Length, Sector Area, Speed",["Arc length and sector area are fractions of the circle, but θ must be in radians.","Angular speed is angle per time. Linear speed v = rω, so points farther out move faster."],["s = rθ","A = ½r²θ","ω = θ/t · v = rω · ω = 2π × (rev per time)"],[["r = 10 cm, θ = 60°. Find s and A.","Convert: 60° = π/3. s = 10(π/3) ≈ 10.47 cm. A = ½(100)(π/3) ≈ 52.36 cm²."],["A wheel of radius 0.3 m spins at 120 rpm. Find v.","ω = 120 × 2π = 240π rad/min. v = 0.3(240π) = 72π ≈ 226 m/min."]]],
["Six Trig Functions (Right Triangles)",["Label the sides opposite, adjacent and hypotenuse relative to θ. csc, sec, cot are reciprocals of sin, cos, tan.","Memorize the triples 3-4-5, 5-12-13, 8-15-17."],["sin = opp/hyp · cos = adj/hyp · tan = opp/adj","csc = hyp/opp · sec = hyp/adj · cot = adj/opp","sin θ = cos(90° − θ)"],[["sin θ = 3/5 (acute). Find cos θ and tan θ.","Opp = 3, hyp = 5, so the missing side is 4. cos θ = 4/5, tan θ = 3/4."],["From 50 m away, the elevation of a tower top is 35°. Height?","tan 35° = h/50, so h = 50 tan 35° ≈ 35 m."]]],
["The Unit Circle and Special Angles",["On the unit circle the point at angle θ is (cos θ, sin θ): cosine is x, sine is y.","To evaluate: find the reference angle, take the special-angle value, then apply the quadrant sign (All Students Take Calculus: QI all, QII sin, QIII tan, QIV cos).","Drag the slider to explore."],["30°: sin ½ · cos √3/2 · tan √3/3","45°: sin √2/2 · cos √2/2 · tan 1","60°: sin √3/2 · cos ½ · tan √3"],[["Find sin(5π/6).","5π/6 = 150° is in QII with reference 30°. sin 30° = ½, and sine is positive in QII, so ½."],["Find tan 240°.","240° is in QIII with reference 60°. tan 60° = √3, and tangent is positive in QIII, so √3."]],"u"],
["Trig Functions of Any Angle",["For any point (x, y) on the terminal side, let r = √(x² + y²). Then the ratios use r.","Quadrantal angles use (1,0), (0,1), (−1,0), (0,−1). A zero denominator means undefined."],["sin = y/r · cos = x/r · tan = y/x","csc = r/y · sec = r/x · cot = x/y"],[["The terminal side passes through (−3, 4). Find sin, cos, tan.","r = √(9 + 16) = 5. So sin = 4/5, cos = −3/5, tan = −4/3."],["sin θ = −5/13 and cos θ > 0. Find cos θ.","Sine negative and cosine positive means QIV. x = 12 (5-12-13), so cos θ = 12/13."]],"u"],
["Graphs of Sine and Cosine",["Amplitude is the height from the midline to a peak. B squeezes the graph horizontally. Always divide C by B to get the phase shift.","Play with the grapher to see each part."],["y = A sin(Bx − C) + D","Amplitude |A| · Period 2π/|B| · Phase shift C/B · Midline y = D"],[["Analyze y = 3 sin(2x − π/2) + 1.","Amplitude 3. Period 2π/2 = π. Phase shift (π/2)/2 = π/4 to the right. Midline y = 1, so the range is −2 to 4."],["Write a sine curve with amplitude 5, period 4π, midline 2.","B = 2π/4π = ½, so y = 5 sin(x/2) + 2."]],"w"],
["Graphs of Tan, Sec, Csc, Cot",["Tangent and cotangent repeat every π. Secant and cosecant repeat every 2π.","Sec and csc are U-shaped branches touching the cos/sin curve at its peaks and valleys, with asymptotes where that curve is zero."],["tan: asymptotes at x = π/2 + kπ; period π/|B|","cot: asymptotes at x = kπ","sec, csc: range y ≤ −1 or y ≥ 1"],[["Period and asymptotes of y = tan 2x?","Period π/2. Asymptotes where 2x = π/2 + kπ, so x = π/4 + kπ/2."],["Range of y = 2 sec x?","Secant never lies between −1 and 1, so doubling gives y ≤ −2 or y ≥ 2."]]],
["Inverse Trig Functions",["Inverse trig returns ONE angle in a fixed range. arcsin and arctan live in QIV to QI; arccos lives in QI to QII.","arcsin(sin x) = x only if x is already in the range."],["arcsin: [−π/2, π/2] · arccos: [0, π] · arctan: (−π/2, π/2)","arcsin(−x) = −arcsin x · arccos(−x) = π − arccos x"],[["Evaluate arcsin(sin 5π/6).","sin 5π/6 = ½ and arcsin ½ = π/6. The answer is π/6, not 5π/6, because 5π/6 is outside the range."],["Evaluate cos(arctan(3/4)).","Let θ = arctan(3/4): opp 3, adj 4, hyp 5. So cos θ = 4/5."]]],
["Fundamental Identities",["Three families: reciprocal, quotient and Pythagorean. Everything else is built from them.","When stuck, rewrite in sin and cos."],["sin²θ + cos²θ = 1","1 + tan²θ = sec²θ · 1 + cot²θ = csc²θ","tan = sin/cos · cot = cos/sin","sin(−θ) = −sin θ · cos(−θ) = cos θ"],[["Simplify sin x cot x.","Replace cot x with cos x/sin x. The sin x cancels, leaving cos x."],["sin x = 3/5 in QII. Find cos x and tan x.","cos x = −√(1 − 9/25) = −4/5 (negative in QII). tan x = (3/5)/(−4/5) = −3/4."]]],
["Verifying Identities",["Pick the more complicated side and transform it into the other. Never move terms across the equals sign.","Tools: convert to sin and cos, common denominators, factoring, conjugates."],["Common move: 1 − cos²x = sin²x","Conjugate: multiply by (1 + sin x)/(1 + sin x)"],[["Prove tan x + cot x = sec x csc x.","LHS = sin/cos + cos/sin = (sin² + cos²)/(sin cos) = 1/(sin x cos x) = sec x csc x. ∎"],["Prove (1 − sin x)/cos x = cos x/(1 + sin x).","Multiply the left by (1 + sin x)/(1 + sin x): (1 − sin²x)/[cos x(1 + sin x)] = cos²x/[cos x(1 + sin x)] = cos x/(1 + sin x). ∎"]]],
["Sum and Difference Formulas",["Use these to get exact values of 15°, 75°, 105° by splitting them into special angles. Cosine flips the sign."],["sin(A ± B) = sin A cos B ± cos A sin B","cos(A ± B) = cos A cos B ∓ sin A sin B","tan(A ± B) = (tan A ± tan B)/(1 ∓ tan A tan B)"],[["Find sin 75° exactly.","75° = 45° + 30°. sin 75° = (√2/2)(√3/2) + (√2/2)(½) = (√6 + √2)/4."],["Simplify cos 50° cos 10° − sin 50° sin 10°.","This matches cos(A + B) with A = 50°, B = 10°, so it equals cos 60° = ½."]]],
["Double and Half-Angle Formulas",["For half-angles the sign comes from the quadrant of A/2, not A. Pick the cos 2A form that uses the information you have."],["sin 2A = 2 sin A cos A","cos 2A = cos²A − sin²A = 2cos²A − 1 = 1 − 2sin²A","tan 2A = 2 tan A/(1 − tan²A)","sin(A/2) = ±√[(1 − cos A)/2] · cos(A/2) = ±√[(1 + cos A)/2]"],[["sin θ = 3/5, θ in QI. Find sin 2θ and cos 2θ.","cos θ = 4/5. sin 2θ = 2(3/5)(4/5) = 24/25. cos 2θ = 1 − 2(9/25) = 7/25."],["Find cos 22.5° exactly.","22.5° is half of 45° and is in QI, so cos is positive: √[(1 + √2/2)/2] = √(2 + √2)/2."]]],
["Product-to-Sum and Sum-to-Product",["Products become sums of the angle sum and difference. Sums become products of the half-sum and half-difference. Watch the minus signs."],["sin A cos B = ½[sin(A+B) + sin(A−B)]","cos A cos B = ½[cos(A−B) + cos(A+B)]","sin A sin B = ½[cos(A−B) − cos(A+B)]","sin A + sin B = 2 sin((A+B)/2) cos((A−B)/2)","cos A − cos B = −2 sin((A+B)/2) sin((A−B)/2)"],[["Evaluate sin 75° + sin 15°.","Sum to product: 2 sin 45° cos 30° = 2(√2/2)(√3/2) = √6/2."],["Write cos 3x − cos x as a product.","−2 sin((3x+x)/2) sin((3x−x)/2) = −2 sin 2x sin x."]]],
["Solving Basic Trig Equations",["Isolate the function, find the reference angle, then list every angle in the interval using the quadrant signs.","For sin 2x, solve for 2x over [0, 4π), then divide by 2."],["sin x = a → x = α + 2πk or π − α + 2πk","cos x = a → x = ±α + 2πk","tan x = a → x = α + πk"],[["Solve 2 sin x − 1 = 0 on [0, 2π).","sin x = ½. Reference π/6, and sine is positive in QI and QII: x = π/6, 5π/6."],["Solve sin 2x = √3/2 on [0, 2π).","2x = π/3, 2π/3, 7π/3, 8π/3 (two turns). Divide by 2: x = π/6, π/3, 7π/6, 4π/3."]]],
["Advanced and Quadratic Equations",["Treat sin x as a variable and factor. Use identities to reach one function only.","Never divide by a trig function that could be zero: factor instead or you lose solutions. Reject values beyond ±1."],["Replace cos²x with 1 − sin²x","cos 2x = 2cos²x − 1"],[["Solve 2sin²x − sin x − 1 = 0 on [0, 2π).","Factor: (2 sin x + 1)(sin x − 1) = 0. sin x = −½ gives 7π/6, 11π/6; sin x = 1 gives π/2."],["Solve sin 2x = sin x on [0, 2π).","2 sin x cos x − sin x = 0, so sin x(2cos x − 1) = 0. sin x = 0 gives 0, π; cos x = ½ gives π/3, 5π/3."]]],
["Law of Sines and the Ambiguous Case",["Use it with AAS, ASA or SSA. In SSA, always test the second angle 180° − B, because arcsin gives only the acute one.","Try the tools below."],["a/sin A = b/sin B = c/sin C","Area = ½ab sin C","SSA with A acute, h = b sin A: a < h none · a = h one · h < a < b two · a ≥ b one"],[["A = 40°, B = 60°, a = 10. Find b.","b = a sin B/sin A = 10 sin 60°/sin 40° ≈ 13.47."],["A = 30°, a = 6, b = 10. How many triangles?","h = 10 sin 30° = 5. Since h < a < b, there are two triangles (B ≈ 56.4° or 123.6°)."]],"l"],
["Law of Cosines and Applications",["Use it for SAS (find the third side) or SSS (find the angles). Find the largest angle first. A negative cosine means an obtuse angle.","Try the calculator below."],["c² = a² + b² − 2ab cos C","cos C = (a² + b² − c²)/(2ab)","Heron: s = (a+b+c)/2, Area = √[s(s−a)(s−b)(s−c)]"],[["a = 7, b = 8, C = 60°. Find c.","c² = 49 + 64 − 2(7)(8)(½) = 57, so c ≈ 7.55."],["Ships leave port at 20 and 30 km/h, 60° apart. Distance after 2 h?","Sides are 40 and 60 km. d² = 1600 + 3600 − 2(40)(60)(½) = 2800, so d ≈ 52.9 km."]],"l"]
];

[2,"Sector area for r = 4 and θ = π/2?",["4π","2π","8π","π"],"A = ½r²θ = ½(16)(π/2) = 4π."],

$("#topic").innerHTML=`<div class="card"><h2>Topic ${R[i]}. ${t[0]}</h2>${t[1].map(p=>`<p>${p}</p>`).join("")}<h3>Key formulas</h3>${t[2].map(f=>`<div class="f">${f}</div>`).join("")}</div>${W(t[4])}<div class="card"><h3 style="margin-top:0">Worked examples (tap to reveal)</h3>${t[3].map((e,k)=>`<details><summary>Example ${k+1}. ${e[0]}</summary><p>${e[1]}</p></details>`).join("")}</div><div class="nav"><button class="btn" ${i?"":"disabled"} onclick="show(${i-1})">← Previous</button>${i<17?`<button class="btn pri" onclick="show(${i+1})">Next →</button>`:`<button class="btn pri" onclick="tab(1)">Take the quiz →</button>`}</div>`;
if(t[4]=="u")uc();if(t[4]=="w")wv();if(t[4]=="l")lw();scrollTo(0,0)}
function W(k){if(k=="u")return`<div class="card"><h3 style="margin-top:0">Unit circle explorer</h3><svg id="ucs" viewBox="-125 -125 250 250" width="260"><circle r="100" fill="none" stroke="var(--bd)" stroke-width="2"/><path d="M-120 0H120M0 -120V120" stroke="var(--mu)" stroke-width="1"/><path id="arc" fill="none" stroke="var(--ac)" stroke-width="3"/><path id="ln" stroke="var(--ac)" stroke-width="2"/><path id="sn" stroke="#d0463b" stroke-width="3"/><path id="cs" stroke="#2a9d5c" stroke-width="3"/><circle id="pt" r="5" fill="var(--ac)"/></svg><input type="range" id="ang" min="0" max="360" value="45"><div class="sp" id="sp"></div><div id="ucv"></div></div>`;
if(k=="w")return`<div class="card"><h3 style="margin-top:0">Sine and cosine grapher: y = A·f(Bx − C) + D</h3><div class="row"><select id="fn"><option>sin</option><option>cos</option></select><label>A <input type="number" id="A" value="2" step="0.5"></label><label>B <input type="number" id="B" value="1" step="0.5" min="0.5"></label><label>C (× π/4) <input type="number" id="C" value="0" step="1"></label><label>D <input type="number" id="D" value="0" step="0.5"></label></div><svg viewBox="0 0 400 200" width="520"><rect width="400" height="200" fill="none" stroke="var(--bd)"/><path d="M0 100H400M200 0V200" stroke="var(--mu)"/><path id="mid" stroke="var(--mu)" stroke-dasharray="4"/><path id="cv" fill="none" stroke="var(--ac)" stroke-width="2.5"/></svg><div id="wi" class="out"></div></div>`;
if(k=="l")return`<div class="card"><h3 style="margin-top:0">Triangle tools</h3><b>Law of Cosines, SAS</b><div class="row"><label>a <input type="number" id="a1" value="7"></label><label>b <input type="number" id="b1" value="8"></label><label>C° <input type="number" id="c1" value="60"></label></div><div class="out" id="o1"></div><b>Law of Cosines, SSS</b><div class="row"><label>a <input type="number" id="a2" value="5"></label><label>b <input type="number" id="b2" value="7"></label><label>c <input type="number" id="c2" value="8"></label></div><div class="out" id="o2"></div><b>Ambiguous case (SSA): angle A, side a, side b</b><div class="row"><label>A° <input type="number" id="a3" value="30"></label><label>a <input type="number" id="b3" value="6"></label><label>b <input type="number" id="c3" value="10"></label></div><div class="out" id="o3"></div></div>`;return""}
function uc(){const sp=$("#sp"),s=$("#ang");[0,30,45,60,90,120,135,150,180,210,225,240,270,300,315,330].forEach(d=>{const b=document.createElement("button");b.textContent=d+"°";b.onclick=()=>{s.value=d;u()};sp.appendChild(b)});s.oninput=u;u();
function u(){const a=+s.value,r=a*Math.PI/180,x=Math.cos(r),y=Math.sin(r),X=x*100,Y=-y*100,g=gcd(a,180)||180,n=a/g,m=180/g,m2=a%360,ref=m2<=90?m2:m2<=180?180-m2:m2<=270?m2-180:360-m2;
$("#pt").setAttribute("cx",X);$("#pt").setAttribute("cy",Y);$("#ln").setAttribute("d",`M0 0L${X} ${Y}`);$("#sn").setAttribute("d",`M${X} 0L${X} ${Y}`);$("#cs").setAttribute("d",`M0 0L${X} 0`);$("#arc").setAttribute("d",`M25 0A25 25 0 ${a>180?1:0} 0 ${25*x} ${-25*y}`);
$("#ucv").innerHTML=`<p><b>θ = ${a}° = ${a==0?"0":(n==1?"":n)+"π"+(m==1?"":"/"+m)} rad</b> · reference angle ${ref}°</p><p><span style="color:#2a9d5c">cos θ = x = ${rd(x)}</span> · <span style="color:#d0463b">sin θ = y = ${rd(y)}</span> · tan θ = ${Math.abs(x)<1e-9?"undefined":rd(y/x)}</p>`}}
function wv(){const g=i=>+$("#"+i).value;function d(){const A=g("A"),B=g("B")||1,C=g("C")*Math.PI/4,D=g("D"),f=$("#fn").value=="sin"?Math.sin:Math.cos;let p="";for(let i=0;i<=400;i+=2){const x=(i-200)/400*4*Math.PI,y=A*f(B*x-C)+D;p+=(i?"L":"M")+i+" "+(100-y*18)}$("#cv").setAttribute("d",p);$("#mid").setAttribute("d",`M0 ${100-D*18}H400`);const ps=C/B/Math.PI;$("#wi").textContent=`Amplitude ${Math.abs(A)} · Period ${rd(2*Math.PI/Math.abs(B))} (= ${rd(2/Math.abs(B))}π) · Phase shift ${rd(ps)}π (${ps>=0?"right":"left"}) · Midline y = ${D}`}["fn","A","B","C","D"].forEach(i=>$("#"+i).oninput=d);d()}
function lw(){const g=i=>+$("#"+i).value,D=Math.PI/180,A=x=>x/D;function d(){const a=g("a1"),b=g("b1"),C=g("c1");$("#o1").textContent=`c = ${rd(Math.sqrt(a*a+b*b-2*a*b*Math.cos(C*D)),2)} · Area = ${rd(.5*a*b*Math.sin(C*D),2)}`;const p=g("a2"),q=g("b2"),r=g("c2");const ok=p+q>r&&p+r>q&&q+r>p;$("#o2").textContent=ok?`A = ${rd(A(Math.acos((q*q+r*r-p*p)/(2*q*r))),2)}° · B = ${rd(A(Math.acos((p*p+r*r-q*q)/(2*p*r))),2)}° · C = ${rd(A(Math.acos((p*p+q*q-r*r)/(2*p*q))),2)}°`:"Not a valid triangle";const a3=g("a3"),s=g("b3"),b3=g("c3"),h=b3*Math.sin(a3*D);let m;if(a3<90)m=s<h-1e-9?"No triangle":Math.abs(s-h)<1e-9?"One right triangle":s<b3?"Two triangles":"One triangle";else m=s<=b3?"No triangle":"One triangle";$("#o3").textContent=`h = ${rd(h,2)} → ${m}`}["a1","b1","c1","a2","b2","c2","a3","b3","c3"].forEach(i=>$("#"+i).oninput=d);d()}
function tab(q){$("#lessons").hidden=!!q;$("#quiz").hidden=!q;$("#tl").className=q?"":"on";$("#tq").className=q?"on":"";if(q&&!$("#quiz").innerHTML)setup()}
$("#tl").onclick=()=>tab(0);$("#tq").onclick=()=>tab(1);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let qs,qi,sc,wr;
function setup(){$("#quiz").innerHTML=`<div class="card"><h2>Practice Quiz</h2><p>Up to 10 random questions with an explanation after every answer. Pick a topic group or take them all.</p><div class="row"><select id="grp">${G.map((g,i)=>`<option value="${i}">${g[0]}</option>`).join("")}</select><button class="btn pri" id="go">Start quiz</button></div></div>`;$("#go").onclick=()=>{const g=G[+$("#grp").value];qs=sh(Q.filter(q=>q[0]>=g[1]&&q[0]<=g[2])).slice(0,10);qi=0;sc=0;wr=new Set;rq()}}
function rq(){const q=qs[qi];const o=sh(q[2].map((t,i)=>[t,i==0]));$("#quiz").innerHTML=`<div class="card"><div class="bar"><i style="width:${qi/qs.length*100}%"></i></div><p style="color:var(--mu)">Question ${qi+1} of ${qs.length} · Topic ${R[q[0]]}</p><h3 style="color:var(--tx);font-size:1.1rem">${q[1]}</h3><div id="os">${o.map((x,i)=>`<button class="btn opt" data-c="${x[1]?1:0}">${x[0]}</button>`).join("")}</div><div id="fb"></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.c=="1")x.classList.add("ok")});const good=b.dataset.c=="1";if(good)sc++;else{b.classList.add("no");wr.add(q[0])}$("#fb").innerHTML=`<p><b style="color:var(${good?"--ok":"--bad"})">${good?"Correct!":"Not quite."}</b> ${q[3]}</p><button class="btn pri" id="nx">${qi+1<qs.length?"Next question →":"See results"}</button>`;$("#nx").onclick=()=>{qi++;qi<qs.length?rq():res()}})}
function res(){const p=Math.round(sc/qs.length*100);$("#quiz").innerHTML=`<div class="card"><h2>Score: ${sc} / ${qs.length} (${p}%)</h2><p>${p>=80?"Excellent work. You are exam-ready on these topics.":p>=50?"Good progress. Review the topics below and try again.":"Keep practicing. Re-read the lessons below, then retry."}</p>${wr.size?`<h3>Review these lessons</h3><div class="sp">${[...wr].sort((a,b)=>a-b).map(i=>`<button onclick="tab(0);show(${i})">${R[i]}. ${T[i][0]}</button>`).join("")}</div>`:""}<div class="row"><button class="btn pri" id="re">New quiz</button></div></div>`;$("#re").onclick=setup}
show(0);
</script></body></html>
