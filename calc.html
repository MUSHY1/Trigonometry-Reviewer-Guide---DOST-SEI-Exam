<header><h1>📘 Calculus Ultimate Reviewer</h1><p>DOST-SEI exam prep: functions, limits, continuity, derivatives, applications, and integrals. Calculator-free examples with every step shown.</p></header>

<script>
const $=s=>document.querySelector(s);
const BL=[["A","Functions and Graphs",0,2],["B","Limits",3,7],["C","Continuity",8,9],["D","Derivatives",10,15],["E","Applications of Derivatives",16,19],["F","Basic Integrals",20,22]];
const blk=i=>BL.find(b=>i>=b[2]&&i<=b[3]);
const T=[
["Function Notation, Domain and Range",["f(x) is the output for the input x. To evaluate, replace every x with the given value and simplify.","The domain is the set of allowed inputs. Ask what could break: dividing by zero, or a negative number under a square root. The range is the set of outputs."],["f(x) = x² − 3x  →  f(2) = (2)² − 3(2)","Denominator ≠ 0 · Under √ must be ≥ 0"],[["If f(x) = 2x² − x + 1, find f(−1).","f(−1) = 2(−1)² − (−1) + 1<br>(−1)² = 1, so 2(1) = 2<br>f(−1) = 2 + 1 + 1 = 4"],["Find the domain of 1/(x² − 9).","Set the denominator equal to 0: x² − 9 = 0<br>(x − 3)(x + 3) = 0, so x = 3 or x = −3<br>Domain: all real x except x = 3 and x = −3"]]],
["Intercepts, Zeros, and Graph Behavior",["Zeros: solve f(x) = 0. The y-intercept is f(0).","End behavior depends on the degree and leading coefficient. Even degree with a positive coefficient: both ends up. Odd degree with a positive coefficient: down on the left, up on the right. A negative coefficient flips the picture. A function increases where its graph rises from left to right."],["Zeros: f(x) = 0 · y-intercept: f(0)","Even degree, a > 0: ↑ ↑ · Odd degree, a > 0: ↓ ↑"],[["Find the zeros and y-intercept of f(x) = x² − 5x + 6.","Zeros: x² − 5x + 6 = 0<br>(x − 2)(x − 3) = 0, so x = 2 or x = 3<br>y-intercept: f(0) = 0 − 0 + 6 = 6"],["Describe the end behavior of y = −2x³ + x.","The degree is 3 (odd) and the leading coefficient is −2 (negative).<br>Odd and positive would be ↓ ↑, so negative flips it.<br>The graph is up on the left and down on the right."]]],
["Rational and Exponential Functions",["A rational function P(x)/Q(x) is undefined where Q(x) = 0. If the factor does not cancel, there is a vertical asymptote. If it cancels, there is a hole.","An exponential function a·bˣ grows when b > 1 and decays when 0 < b < 1. For yearly change, use a(1 + r)ᵗ or a(1 − r)ᵗ."],["f(x) = a·bˣ: b > 1 growth, 0 < b < 1 decay","Growth: a(1 + r)ᵗ · Decay: a(1 − r)ᵗ"],[["Find the vertical asymptote of (x + 1)/(x − 2).","Set the denominator equal to 0: x − 2 = 0<br>x = 2<br>The numerator is not 0 at x = 2, so the vertical asymptote is x = 2."],["A car worth ₱500 000 loses 10% each year. What is it worth after 2 years?","V = 500 000(1 − 0.10)² = 500 000(0.9)²<br>(0.9)² = 0.81<br>V = 500 000 × 0.81 = ₱405 000"]]],
["Concept of a Limit",["A limit is the value a function gets close to as x gets close to a. What happens exactly at x = a does not matter.","Use the explorer to see the function from both sides of a, and watch the values close in on the limit."],["lim (x→a) f(x) = L","The limit ignores f(a) itself"],[["What is lim (x→1) (x² − 1)/(x − 1)?","At x = 1 the function is 0/0, but near 1 the values are:<br>x = 0.9 → 1.9, x = 0.99 → 1.99, x = 1.01 → 2.01<br>They approach 2, so the limit is 2 (even though f(1) is undefined)."],["True or false: if f(a) is undefined, the limit at a cannot exist.","False. The limit depends only on nearby values.<br>Example: (x² − 1)/(x − 1) is undefined at 1, but the limit is 2."]],"l"],
["Direct Substitution and Factoring",["Step 1: plug in x = a. If you get a number, that is the limit. If you get 0/0, a common factor is hiding, so factor and cancel, then substitute again. If you get k/0 with k ≠ 0, the function is unbounded."],["Number → done · 0/0 → factor · k/0 → unbounded","x² − a² = (x − a)(x + a)"],[["Find lim (x→3) (2x² − 5).","Substitute x = 3: 2(3)² − 5<br>(3)² = 9, so 2(9) = 18<br>18 − 5 = 13"],["Find lim (x→2) (x² − 4)/(x − 2).","Substitute: (4 − 4)/(2 − 2) = 0/0, so factor<br>(x² − 4)/(x − 2) = (x − 2)(x + 2)/(x − 2) = x + 2<br>lim (x + 2) = 2 + 2 = 4"]]],
["Limits by Rationalization",["When a square root creates 0/0, multiply the top and bottom by the conjugate. The product (a − b)(a + b) = a² − b² removes the root."],["(√u − c)(√u + c) = u − c²"],[["Find lim (x→0) (√(x + 4) − 2)/x.","Substitute: (2 − 2)/0 = 0/0. Multiply by the conjugate (√(x + 4) + 2):<br>[(x + 4) − 4] / [x(√(x + 4) + 2)] = x / [x(√(x + 4) + 2)]<br>Cancel x: 1/(√(x + 4) + 2)<br>At x = 0: 1/(2 + 2) = 1/4"],["Find lim (x→0) (√(x + 9) − 3)/x.","Multiply by (√(x + 9) + 3):<br>[(x + 9) − 9] / [x(√(x + 9) + 3)] = 1/(√(x + 9) + 3)<br>At x = 0: 1/(3 + 3) = 1/6"]]],
["One-Sided Limits and Limits That Do Not Exist",["A two-sided limit exists only if the left-hand limit (x → a⁻) and the right-hand limit (x → a⁺) are equal.","A limit fails to exist when the sides disagree, when the function grows without bound, or when it oscillates."],["lim (x→a) f(x) exists ⇔ left = right"],[["Find lim (x→0) |x|/x.","For x > 0: |x| = x, so |x|/x = 1 (right limit 1)<br>For x < 0: |x| = −x, so |x|/x = −1 (left limit −1)<br>1 ≠ −1, so the limit does not exist."],["Does lim (x→0) 1/x² exist?","As x → 0 from either side, x² gets tiny and positive, so 1/x² grows without bound.<br>The values do not approach a number, so the limit does not exist (it is +∞)."]],"l"],
["Limits at Infinity",["As x → ∞, only the highest powers matter. Compare the degrees of the numerator and denominator.","Divide the top and bottom by the highest power of x to see this clearly."],["Top degree < bottom → 0","Equal degrees → ratio of leading coefficients","Top degree > bottom → no finite limit"],[["Find lim (x→∞) (4x³ + 2)/(2x³ − x).","Divide the top and bottom by x³:<br>(4 + 2/x³)/(2 − 1/x²)<br>As x → ∞, 2/x³ → 0 and 1/x² → 0<br>Limit = 4/2 = 2"],["Find lim (x→∞) (3x + 1)/(x² − 5).","The top degree (1) is less than the bottom degree (2).<br>Divide by x²: (3/x + 1/x²)/(1 − 5/x²) → 0/1 = 0"]]],
["Continuity: The Test and the Types",["f is continuous at x = a when all three hold: (1) f(a) is defined; (2) the limit exists; (3) the limit equals f(a). Informally: you can draw it without lifting your pencil.","Removable: a hole. Jump: left and right limits differ. Infinite: a vertical asymptote."],["f(a) defined · lim exists · lim = f(a)"],[["Is (x² − 1)/(x − 1) continuous at x = 1? What type?","Condition 1 fails: f(1) = 0/0 is undefined.<br>The limit exists: (x − 1)(x + 1)/(x − 1) = x + 1 → 2.<br>So it is discontinuous: a removable discontinuity (a hole at (1, 2))."],["Where is 1/(x² − 4) discontinuous?","The denominator is 0 when x² − 4 = 0, so (x − 2)(x + 2) = 0.<br>x = 2 and x = −2: infinite discontinuities (vertical asymptotes)."]]],
["Continuity over an Interval",["Polynomials and exponentials are continuous everywhere. Rational functions are continuous except where the denominator is 0. For a piecewise function, check the joint: the left piece and the right piece must give the same value there."],["Piecewise joint: left value = right value"],[["Find k so f is continuous at x = 2: f(x) = x + 1 for x < 2, kx − 1 for x ≥ 2.","Left piece at x = 2: 2 + 1 = 3<br>Right piece at x = 2: k(2) − 1 = 2k − 1<br>Set equal: 2k − 1 = 3, so 2k = 4 and k = 2"],["Where is (x + 3)/(x² − 1) continuous?","Denominator zero: x² − 1 = 0 → x = 1 or x = −1<br>Continuous for all real x except x = 1 and x = −1."]]],
["The Derivative: Concept and First Principles",["The derivative is the slope of the tangent line, the instantaneous rate of change. The slope between two points is a secant slope; letting the points merge (h → 0) gives the tangent slope.","Notation: f′(x) or dy/dx."],["f′(x) = lim (h→0) [f(x + h) − f(x)] / h"],[["Find f′(x) for f(x) = x² from first principles.","[(x + h)² − x²]/h = [x² + 2xh + h² − x²]/h<br>= (2xh + h²)/h = 2x + h<br>As h → 0: f′(x) = 2x"],["Find f′(x) for f(x) = 3x + 2 from first principles.","[3(x + h) + 2 − (3x + 2)]/h = [3x + 3h + 2 − 3x − 2]/h<br>= 3h/h = 3<br>f′(x) = 3"]]],
["Basic Rules: Constant, Power, Sum, Radicals",["Constant rule: the derivative of a number is 0. Power rule: bring the power down and reduce it by 1. Constants multiply through, and sums and differences go term by term.","The power rule only works on powers, so rewrite roots and fractions as exponents first: √x = x^(1/2) and 1/xⁿ = x^(−n)."],["d/dx (c) = 0 · d/dx (xⁿ) = n·xⁿ⁻¹","√x = x^(1/2) · 1/x² = x⁻²"],[["Differentiate 4x³ − 5x + 7.","Term by term: d/dx 4x³ = 4·3x² = 12x²<br>d/dx (−5x) = −5<br>d/dx (7) = 0<br>Answer: 12x² − 5"],["Differentiate √x and 1/x².","√x = x^(1/2): (1/2)x^(−1/2) = 1/(2√x)<br>1/x² = x⁻²: (−2)x⁻³ = −2/x³"]]],
["Product Rule and Quotient Rule",["Product rule: derivative of the first times the second, plus the first times the derivative of the second.","Quotient rule: low d-high minus high d-low, over low squared."],["(uv)′ = u′v + uv′","(u/v)′ = (u′v − uv′) / v²"],[["Differentiate x²(3x + 1).","u = x², u′ = 2x; v = 3x + 1, v′ = 3<br>u′v + uv′ = 2x(3x + 1) + x²(3)<br>= 6x² + 2x + 3x² = 9x² + 2x<br>Check: expanding first gives 3x³ + x², and its derivative is 9x² + 2x ✓"],["Differentiate x/(x + 1).","u = x, u′ = 1; v = x + 1, v′ = 1<br>(u′v − uv′)/v² = [1(x + 1) − x(1)]/(x + 1)²<br>= (x + 1 − x)/(x + 1)² = 1/(x + 1)²"]]],
["The Chain Rule",["For a function inside a function, differentiate the outside, keep the inside the same, then multiply by the derivative of the inside."],["d/dx f(g(x)) = f′(g(x)) · g′(x)"],[["Differentiate (3x + 1)⁴.","Outside: 4(…)³; inside: 3x + 1, derivative 3<br>4(3x + 1)³ · 3 = 12(3x + 1)³"],["Differentiate (x² + 1)⁵.","Outside: 5(…)⁴; inside: x² + 1, derivative 2x<br>5(x² + 1)⁴ · 2x = 10x(x² + 1)⁴"]]],
["Exponentials and Higher-Order Derivatives",["The function eˣ is its own derivative. With an inside multiplier, the chain rule brings out k. A higher-order derivative is the derivative of the derivative."],["d/dx eˣ = eˣ · d/dx e^(kx) = k·e^(kx)","d/dx aˣ = aˣ ln a"],[["Differentiate e^(2x).","Outside: e^(2x); inside 2x has derivative 2<br>d/dx e^(2x) = 2e^(2x)"],["Find f′, f″, f‴ for f(x) = x⁴.","f′(x) = 4x³<br>f″(x) = 4·3x² = 12x²<br>f‴(x) = 12·2x = 24x"]]],
["Tangent Line Equations",["Find the point (a, f(a)) and the slope f′(a), then use the point-slope form. Try the explorer to see the tangent move."],["y − f(a) = f′(a)(x − a)"],[["Tangent to f(x) = x² at x = 3.","Point: f(3) = 9, so (3, 9)<br>Slope: f′(x) = 2x, f′(3) = 6<br>y − 9 = 6(x − 3) = 6x − 18<br>y = 6x − 9"],["Tangent to y = x³ at x = 1.","Point: f(1) = 1, so (1, 1)<br>Slope: f′(x) = 3x², f′(1) = 3<br>y − 1 = 3(x − 1) = 3x − 3<br>y = 3x − 2"]],"t"],
["Increasing, Decreasing, and Critical Points",["The sign of f′ gives the direction: f′ > 0 means increasing, f′ < 0 means decreasing. Critical points are where f′ = 0 or f′ is undefined. Make a sign chart: test a value in each interval."],["f′ > 0 ↗ · f′ < 0 ↘ · critical: f′ = 0"],[["Find the critical point and the intervals for f(x) = x² − 4x + 1.","f′(x) = 2x − 4 = 0, so 2x = 4 and x = 2<br>Test x = 0: f′(0) = −4 < 0 → decreasing on (−∞, 2)<br>Test x = 3: f′(3) = 2 > 0 → increasing on (2, ∞)"],["Where is f(x) = x³ − 3x increasing?","f′(x) = 3x² − 3 = 3(x − 1)(x + 1) = 0, so x = −1 or x = 1<br>Test x = −2: 3(4) − 3 = 9 > 0 ↗; x = 0: −3 < 0 ↘; x = 2: 9 > 0 ↗<br>Increasing on (−∞, −1) and (1, ∞)"]]],
["Extrema and Concavity",["First derivative test: f′ changes − to + at a local minimum, + to − at a local maximum. On a closed interval [a, b], compare f at the critical points and endpoints for the absolute extrema.","Concavity: f″ > 0 concave up, f″ < 0 concave down. An inflection point is where concavity changes."],["f″ > 0 ∪ · f″ < 0 ∩"],[["Find the absolute extrema of f(x) = x² − 4x + 1 on [0, 5].","Critical point x = 2. Compare:<br>f(0) = 1<br>f(2) = 4 − 8 + 1 = −3<br>f(5) = 25 − 20 + 1 = 6<br>Absolute min −3 at x = 2; absolute max 6 at x = 5"],["Classify the points of f(x) = x³ − 3x.","f′ = 3x² − 3 = 0 → x = ±1; f″ = 6x<br>f″(−1) = −6 < 0 → local max, f(−1) = −1 + 3 = 2<br>f″(1) = 6 > 0 → local min, f(1) = 1 − 3 = −2<br>f″(0) = 0 and changes sign → inflection at (0, 0)"]]],
["Basic Optimization",["Define the variables, write the quantity to maximize or minimize, use the constraint to get one variable, differentiate, set equal to 0, and check the answer."],["Constraint → one variable → f′ = 0"],[["100 m of fencing: maximize the area of a rectangle.","x + y = 50, so y = 50 − x<br>A = x(50 − x) = 50x − x²<br>A′ = 50 − 2x = 0, so x = 25 and y = 25<br>A = 25 · 25 = 625 m²"],["Two positive numbers add to 20. Maximize their product.","y = 20 − x<br>P = x(20 − x) = 20x − x²<br>P′ = 20 − 2x = 0, so x = 10 and y = 10<br>P = 10 · 10 = 100"]]],
["Rates of Change in Word Problems",["Velocity is the derivative of position, and acceleration is the derivative of velocity. “How fast” or “per unit” in a problem means a derivative."],["v = s′ · a = v′"],[["s(t) = t² − 6t. Find v(t), a(t), and when the object is at rest.","v(t) = s′(t) = 2t − 6<br>a(t) = v′(t) = 2<br>At rest: v = 0 → 2t − 6 = 0 → t = 3"],["A circle’s radius grows at 2 cm/s. How fast does the area grow when r = 5?","A = πr², so dA/dt = 2πr · dr/dt<br>= 2π(5)(2) = 20π cm²/s"]],"t"],
["Antiderivatives and the Power Rule",["An antiderivative F of f satisfies F′ = f. Integrating reverses differentiating, and an indefinite integral always includes + C. For the power rule, add 1 to the power and divide by the new power."],["∫ xⁿ dx = xⁿ⁺¹/(n + 1) + C, n ≠ −1","∫ f dx = F(x) + C"],[["Find ∫(3x² + 2x) dx.","∫3x² dx = 3·x³/3 = x³<br>∫2x dx = 2·x²/2 = x²<br>Answer: x³ + x² + C"],["Find ∫√x dx.","√x = x^(1/2)<br>Add 1 to the power: 1/2 + 1 = 3/2<br>Divide by 3/2: x^(3/2)/(3/2) = (2/3)x^(3/2) + C"]]],
["Definite Integrals and the Fundamental Theorem",["A definite integral has limits and no + C. Find an antiderivative F, plug in the top limit, plug in the bottom limit, and subtract."],["∫ₐᵇ f(x) dx = F(b) − F(a)"],[["Evaluate ∫₀² x² dx.","F(x) = x³/3<br>F(2) = 8/3 and F(0) = 0<br>8/3 − 0 = 8/3"],["Evaluate ∫₁³ 2x dx.","F(x) = x²<br>F(3) = 9 and F(1) = 1<br>9 − 1 = 8"]]],
["Area and Net Signed Area",["The definite integral is signed area: above the x-axis counts positive, below counts negative. For total area, split at the x-intercepts. Rectangle sums with more and more rectangles approach the exact integral."],["Area = ∫ f(x) dx (when f ≥ 0)","Net area = area above − area below"],[["Area under y = 2x from 0 to 3.","∫₀³ 2x dx = [x²]₀³ = 9 − 0 = 9<br>Check with a triangle: ½ · base 3 · height 6 = 9 ✓"],["Evaluate ∫₋₁¹ x dx.","F(x) = x²/2<br>F(1) = 1/2 and F(−1) = 1/2<br>1/2 − 1/2 = 0 (the two halves cancel)"]],"r"]
];
const Q=[
[0,"If f(x) = 2x² − x + 1, then f(−1) = ?",["4","2","0","−2"],"2(−1)² − (−1) + 1 = 2 + 1 + 1 = 4."],
[0,"What is the domain of 1/(x² − 9)?",["All x except 3 and −3","All x except 3","All real x","x ≥ 3"],"x² − 9 = 0 at x = ±3, so those are excluded."],
[1,"The zeros of x² − 5x + 6 are:",["2 and 3","−2 and −3","1 and 6","−2 and 3"],"(x − 2)(x − 3) = 0."],
[1,"End behavior of y = −2x³ + x:",["Up on the left, down on the right","Up on both sides","Down on both sides","Down on the left, up on the right"],"Odd degree with a negative leading coefficient."],
[2,"V = 500(0.9)ᵗ. What is V after 2 years?",["405","450","400","410"],"(0.9)² = 0.81 and 500 × 0.81 = 405."],

[4,"lim (x→3) (2x² − 5) = ?",["13","11","18","1"],"2(9) − 5 = 18 − 5 = 13."],
[4,"lim (x→−3) (x² + x − 6)/(x + 3) = ?",["−5","5","0","−3"],"(x + 3)(x − 2)/(x + 3) = x − 2 → −5."],
[5,"lim (x→0) (√(x + 9) − 3)/x = ?",["1/6","0","1/3","6"],"Multiply by the conjugate: x/[x(√(x+9) + 3)] = 1/(√(x+9) + 3) → 1/6."],
[6,"lim (x→0) |x|/x is:",["Does not exist","1","−1","0"],"The left limit is −1 and the right limit is 1."],
[7,"lim (x→∞) (4x³ + 2)/(2x³ − x) = ?",["2","4","0","∞"],"Equal degrees: ratio of leading coefficients 4/2 = 2."],
[8,"(x² − 1)/(x − 1) at x = 1 has:",["A removable discontinuity","A jump","An infinite discontinuity","No discontinuity"],"f(1) is undefined, but the limit (2) exists, so it is a hole."],
[9,"f(x) = x + 1 (x < 2), kx − 1 (x ≥ 2). f is continuous when k = ?",["2","1","3","3/2"],"Left value 3. Right value 2k − 1 = 3, so k = 2."],
[10,"For f(x) = x², [f(x + h) − f(x)]/h simplifies to:",["2x + h","2x","x + h","2xh"],"(2xh + h²)/h = 2x + h."],
[11,"d/dx (4x³ − 5x + 7) = ?",["12x² − 5","12x² − 5x","4x² − 5","12x³ − 5"],"Power rule term by term; the derivative of 7 is 0."],

[12,"d/dx [x²(3x + 1)] = ?",["9x² + 2x","6x² + 2x","3x²","9x² + 1"],"2x(3x + 1) + 3x² = 9x² + 2x."],
[12,"d/dx [x/(x + 1)] = ?",["1/(x + 1)²","x/(x + 1)²","1/(x + 1)","−1/(x + 1)²"],"[(x + 1) − x]/(x + 1)² = 1/(x + 1)²."],
[13,"d/dx (3x + 1)⁴ = ?",["12(3x + 1)³","4(3x + 1)³","3(3x + 1)⁴","12(3x + 1)⁴"],"4(3x + 1)³ · 3."],
[14,"d/dx e^(2x) = ?",["2e^(2x)","e^(2x)","2eˣ","e^(2x)/2"],"The chain rule brings out the factor 2."],
[14,"If f(x) = x⁴, then f″(x) = ?",["12x²","4x³","24x","12x"],"f′ = 4x³, f″ = 12x²."],
[15,"The tangent line to y = x² at x = 3 is:",["y = 6x − 9","y = 6x + 9","y = 3x − 6","y = 9x − 18"],"Point (3, 9), slope 6: y − 9 = 6(x − 3)."],
[16,"The critical point of f(x) = x² − 4x + 1 is:",["x = 2","x = −2","x = 4","x = 1"],"f′ = 2x − 4 = 0."],
[17,"The inflection point of f(x) = x³ − 3x is at:",["x = 0","x = 1","x = −1","x = 3"],"f″ = 6x changes sign at x = 0."],

[19,"s(t) = t² − 6t. The velocity at t = 4 is:",["2","−8","8","4"],"v = 2t − 6 = 2(4) − 6 = 2."],
[20,"∫(3x² + 2x) dx = ?",["x³ + x² + C","6x + 2 + C","x³ + x²","3x³ + 2x² + C"],"Add 1 to each power and divide; include + C."],
[20,"∫√x dx = ?",["(2/3)x^(3/2) + C","(1/2)x^(−1/2) + C","x^(3/2) + C","(3/2)x^(3/2) + C"],"x^(1/2) → x^(3/2)/(3/2)."],

[22,"The area under y = 2x from 0 to 3 is:",["9","6","18","3"],"∫₀³ 2x dx = 9."],

const G=[["All topics",0,22],["A  Functions and graphs",0,2],["B  Limits",3,7],["C  Continuity",8,9],["D  Derivatives",10,15],["E  Applications of derivatives",16,19],["F  Basic integrals",20,22]];
let cur=0;
function chips(){let h="",lb="";T.forEach((t,i)=>{const b=blk(i);if(b[0]!=lb){lb=b[0];h+=`<i>${b[0]}</i>`}h+=`<button data-i="${i}" class="${i==cur?"on":""}">${i+1}. ${t[0]}</button>`});$("#chips").innerHTML=h;document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>show(+b.dataset.i));const on=document.querySelector("#chips .on");on&&on.scrollIntoView({inline:"center",block:"nearest"})}
function show(i){cur=i;chips();const t=T[i],b=blk(i);
$("#topic").innerHTML=`<div class="card"><p style="color:var(--mu);margin:0 0 4px;font-size:.85rem">Block ${b[0]}: ${b[1]}</p><h2>${i+1}. ${t[0]}</h2>${t[1].map(p=>`<p>${p}</p>`).join("")}<h3>Key formulas</h3>${t[2].map(f=>`<div class="f">${f}</div>`).join("")}</div>${W(t[4])}<div class="card"><h3 style="margin-top:0">Worked examples (tap to reveal the full solution)</h3>${t[3].map((e,k)=>`<details><summary>Example ${k+1}. ${e[0]}</summary><p>${e[1]}</p></details>`).join("")}</div><div class="nav"><button class="btn" ${i?"":"disabled"} onclick="show(${i-1})">← Previous</button>${i<T.length-1?`<button class="btn pri" onclick="show(${i+1})">Next →</button>`:`<button class="btn pri" onclick="tab(1)">Take the quiz →</button>`}</div>`;
if(t[4]=="l")lim();if(t[4]=="t")tan();if(t[4]=="r")rie();scrollTo(0,0)}
function W(k){const c=(h,b)=>`<div class="card"><h3 style="margin-top:0">${h}</h3>${b}</div>`;
if(k=="l")return c("Limit explorer","<div class='row'><select id='lf'></select></div><div id='lg'></div><div class='out' id='lo'></div><div id='lt'></div>");
if(k=="t")return c("Tangent line explorer","<div class='row'><select id='tf'></select></div><div id='tg'></div><label>Point x = <b id='txv'></b></label><input type='range' id='tx' min='-3' max='3' step='0.5' value='1'><div class='out' id='to'></div>");
if(k=="r")return c("Rectangle sums approaching the integral","<div class='row'><select id='rf'></select><select id='rm'><option value='l'>Left sum</option><option value='r'>Right sum</option><option value='m'>Midpoint sum</option></select></div><div id='rg'></div><label>Number of rectangles n = <b id='rnv'></b></label><input type='range' id='rn' min='1' max='50' value='4'><div class='out' id='ro'></div>");return""}
function GR(xl,yl){const W=420,H=240,X=x=>(x-xl[0])/(xl[1]-xl[0])*W,Y=y=>H-(y-yl[0])/(yl[1]-yl[0])*H;
const path=(f,a,b)=>{let d="",pen=0;for(let i=0;i<=240;i++){const x=a+(b-a)*i/240,y=f(x);if(!isFinite(y)||y<yl[0]-3||y>yl[1]+3){pen=0;continue}d+=(pen?"L":"M")+X(x).toFixed(1)+" "+Y(y).toFixed(1);pen=1}return d};
const ax=`<rect width="${W}" height="${H}" fill="none" stroke="var(--bd)"/><path d="M0 ${Y(0)}H${W}M${X(0)} 0V${H}" stroke="var(--mu)" stroke-width="1"/>`;return{W,H,X,Y,path,ax}}
const f2=(v,n=4)=>(+v.toFixed(n)).toString();
function lim(){const F=[["(x² − 1)/(x − 1), a = 1",x=>(x*x-1)/(x-1),1,2,[-1,3],[-1,4]],["(x² − 4)/(x − 2), a = 2",x=>(x*x-4)/(x-2),2,4,[0,4],[-1,7]],["(√(x + 4) − 2)/x, a = 0",x=>(Math.sqrt(x+4)-2)/x,0,.25,[-3,5],[-.5,1]],["|x|/x, a = 0",x=>Math.abs(x)/x,0,null,[-3,3],[-2,2]]];
$("#lf").innerHTML=F.map((f,i)=>`<option value="${i}">${f[0]}</option>`).join("");
function u(){const f=F[+$("#lf").value],g=GR(f[4],f[5]);let s=g.ax+`<path d="${g.path(f[1],f[4][0]+.001,f[4][1])}" fill="none" stroke="var(--ac)" stroke-width="2.4"/>`;if(f[3]!==null)s+=`<circle cx="${g.X(f[2])}" cy="${g.Y(f[3])}" r="5" fill="var(--card)" stroke="var(--ac)" stroke-width="2"/>`;else s+=`<circle cx="${g.X(0)}" cy="${g.Y(-1)}" r="5" fill="var(--card)" stroke="var(--ac)" stroke-width="2"/><circle cx="${g.X(0)}" cy="${g.Y(1)}" r="5" fill="var(--card)" stroke="var(--ac)" stroke-width="2"/>`;
$("#lg").innerHTML=`<svg viewBox="0 0 ${g.W} ${g.H}" width="${g.W}">${s}</svg>`;
$("#lt").innerHTML="<table><tr><th>h</th><th>f(a − h)</th><th>f(a + h)</th></tr>"+[.5,.1,.01,.001].map(h=>`<tr><td>${h}</td><td>${f2(f[1](f[2]-h))}</td><td>${f2(f[1](f[2]+h))}</td></tr>`).join("")+"</table>";
$("#lo").textContent=f[3]!==null?`Both sides approach ${f2(f[3])}, so the limit is ${f2(f[3])}.`:"The left side goes to −1 and the right side goes to 1, so the limit does not exist."}
$("#lf").onchange=u;u()}
function tan(){const F=[["f(x) = x²",x=>x*x,x=>2*x,[-3.5,3.5],[-2,10]],["f(x) = x³",x=>x**3,x=>3*x*x,[-3,3],[-12,12]],["f(x) = x² − 4x + 1",x=>x*x-4*x+1,x=>2*x-4,[-2,6],[-5,12]]];
$("#tf").innerHTML=F.map((f,i)=>`<option value="${i}">${f[0]}</option>`).join("");
function u(){const f=F[+$("#tf").value],x0=+$("#tx").value,y0=f[1](x0),m=f[2](x0),g=GR(f[3],f[4]);$("#txv").textContent=x0;
const tl=x=>m*(x-x0)+y0;$("#tg").innerHTML=`<svg viewBox="0 0 ${g.W} ${g.H}" width="${g.W}">${g.ax}<path d="${g.path(f[1],f[3][0],f[3][1])}" fill="none" stroke="var(--ac)" stroke-width="2.4"/><path d="${g.path(tl,f[3][0],f[3][1])}" fill="none" stroke="#e83e8c" stroke-width="2"/><circle cx="${g.X(x0)}" cy="${g.Y(y0)}" r="5" fill="#e83e8c"/></svg>`;
const b=y0-m*x0;$("#to").innerHTML=`Point (${x0}, ${f2(y0)}) · slope f′(${x0}) = ${f2(m)}<br>Tangent: y − ${f2(y0)} = ${f2(m)}(x − ${x0}) → y = ${f2(m)}x ${b<0?"−":"+"} ${f2(Math.abs(b))}`}
$("#tf").onchange=u;$("#tx").oninput=u;u()}
function rie(){const F=[["f(x) = x² on [0, 2]  (exact 8/3)",x=>x*x,0,2,8/3,"8/3",[-.2,2.2],[-.3,4.5]],["f(x) = x on [0, 3]  (exact 9/2)",x=>x,0,3,4.5,"9/2",[-.2,3.2],[-.3,3.5]],["f(x) = x² + 1 on [0, 3]  (exact 12)",x=>x*x+1,0,3,12,"12",[-.2,3.2],[-.5,11]]];
$("#rf").innerHTML=F.map((f,i)=>`<option value="${i}">${f[0]}</option>`).join("");
function u(){const f=F[+$("#rf").value],n=+$("#rn").value,m=$("#rm").value,g=GR(f[6],f[7]),dx=(f[3]-f[2])/n;$("#rnv").textContent=n;let S=0,s=g.ax;
for(let i=0;i<n;i++){const xa=f[2]+i*dx,xs=m=="l"?xa:m=="r"?xa+dx:xa+dx/2,h=f[1](xs);S+=h*dx;s+=`<rect x="${g.X(xa)}" y="${g.Y(Math.max(h,0))}" width="${Math.max(g.X(xa+dx)-g.X(xa)-.5,.5)}" height="${Math.abs(g.Y(0)-g.Y(h))}" fill="#f7a823" fill-opacity=".55" stroke="#c9801a" stroke-width=".6"/>`}
s+=`<path d="${g.path(f[1],f[6][0],f[6][1])}" fill="none" stroke="var(--ac)" stroke-width="2.4"/>`;$("#rg").innerHTML=`<svg viewBox="0 0 ${g.W} ${g.H}" width="${g.W}">${s}</svg>`;
$("#ro").innerHTML=`Sum with n = ${n}: ${f2(S)} · exact integral: ${f[5]} ≈ ${f2(f[4])} · error ${f2(Math.abs(S-f[4]))}`}
$("#rf").onchange=u;$("#rm").onchange=u;$("#rn").oninput=u;u()}
function tab(q){$("#lessons").hidden=!!q;$("#quiz").hidden=!q;$("#tl").className=q?"":"on";$("#tq").className=q?"on":"";if(q&&!$("#quiz").innerHTML)setup()}
$("#tl").onclick=()=>tab(0);$("#tq").onclick=()=>tab(1);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let qs,qi,sc,wr;
function setup(){$("#quiz").innerHTML=`<div class="card"><h2>Practice Quiz</h2><p>Up to 10 random questions, all solvable without a calculator. You get an explanation after every answer.</p><div class="row"><select id="grp">${G.map((g,i)=>`<option value="${i}">${g[0]}</option>`).join("")}</select><button class="btn pri" id="go">Start quiz</button></div></div>`;$("#go").onclick=()=>{const g=G[+$("#grp").value];qs=sh(Q.filter(q=>q[0]>=g[1]&&q[0]<=g[2])).slice(0,10);qi=0;sc=0;wr=new Set;rq()}}
function rq(){const q=qs[qi];const o=sh(q[2].map((t,i)=>[t,i==0]));$("#quiz").innerHTML=`<div class="card"><div class="bar"><i style="width:${qi/qs.length*100}%"></i></div><p style="color:var(--mu)">Question ${qi+1} of ${qs.length} · Topic ${q[0]+1}</p><h3 style="color:var(--tx);font-size:1.1rem">${q[1]}</h3><div>${o.map(x=>`<button class="btn opt" data-c="${x[1]?1:0}">${x[0]}</button>`).join("")}</div><div id="fb"></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.c=="1")x.classList.add("ok")});const good=b.dataset.c=="1";if(good)sc++;else{b.classList.add("no");wr.add(q[0])}$("#fb").innerHTML=`<p><b style="color:var(${good?"--ok":"--bad"})">${good?"Correct!":"Not quite."}</b> ${q[3]}</p><button class="btn pri" id="nx">${qi+1<qs.length?"Next question →":"See results"}</button>`;$("#nx").onclick=()=>{qi++;qi<qs.length?rq():res()}})}
function res(){const p=Math.round(sc/qs.length*100);$("#quiz").innerHTML=`<div class="card"><h2>Score: ${sc} / ${qs.length} (${p}%)</h2><p>${p>=80?"Excellent work. You are exam-ready on these topics.":p>=50?"Good progress. Review the lessons below and try again.":"Keep practicing. Re-read the lessons below, then retry."}</p>${wr.size?`<h3>Review these lessons</h3><div class="row">${[...wr].sort((a,b)=>a-b).map(i=>`<button class="btn" onclick="tab(0);show(${i})">${i+1}. ${T[i][0]}</button>`).join("")}</div>`:""}<div class="row"><button class="btn pri" id="re">New quiz</button></div></div>`;$("#re").onclick=setup}
show(0);
</script></body></html>
